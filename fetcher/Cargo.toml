[package]
name = "fetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
lapin = "4.10.0"
reqwest = { version = "0.13.4", features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
