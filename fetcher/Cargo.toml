[package]
name = "fetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1.11.0"
aws-sdk-s3 = "1.143.0"
lapin = "4.10.0"
reqwest = { version = "0.13.4", features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
