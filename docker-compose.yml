services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped

    ports:
      - "${DOCKER_MINIO_PORT:-9000}:9000"
      - "${DOCKER_MINIO_CONSOLE_PORT:-9001}:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USERNAME}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped

    ports:
      - "${DOCKER_POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}

    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped

    ports:
      - "${DOCKER_RABBITMQ_PORT:-5672}:5672"
      - "${DOCKER_RABBITMQ_CONSOLE_PORT:-15672}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ROOT_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ROOT_PASSWORD}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  faststream:
    build:
      context: broker
      dockerfile: Dockerfile
    container_name: faststream
    depends_on:
      rabbitmq:
        condition: service_healthy

    env_file:
      - .env

  crontab:
    build:
      context: scheduler
      dockerfile: Dockerfile
    container_name: crontab
    depends_on:
      rabbitmq:
        condition: service_healthy

    env_file:
      - .env

volumes:
  minio_data:
  postgres_data:
  rabbitmq_data:
