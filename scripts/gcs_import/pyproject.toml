[project]
name = "gcs-import"
version = "0.1.0"
description = ""
authors = [
    {name = "Enzo Santos",email = "enzo.santos29@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "google-cloud-storage (>=3.13.1,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "boto3 (>=1.43.78,<2.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pillow (>=12.3.0,<13.0.0)"
]

[tool.poetry]
packages = [{include = "gcs_import", from = "src"}]


[tool.poetry.group.dev.dependencies]
